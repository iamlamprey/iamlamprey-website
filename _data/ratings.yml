# Per-product ratings, pooled by hand from the marketplaces each product is/was
# sold on. Keyed by the page's `slug:` front matter.
#
# This is the *pooled* source and the fallback badge. _data/ratings-live.yml —
# generated hourly from this site's own verified-purchase ratings — supersedes it
# for a product once that product has 10 of them, and the choice between the two
# is made in one place: _includes/product-rating.html. Every rating counts,
# including the low ones, and a badge is shown only at an average of 4.0 or more.
#
# A product with no entry here (or in the live file) renders NO stars at all, and
# that is deliberate: a page with no reviews of its own shows none rather than
# borrowing a store-wide figure, which reads as a rating the product has not
# earned. The sample packs have no entry for exactly that reason; Altar and Muzzle
# carry a `slug:` of their own now but no entry here, so their badge waits on 10
# ratings of their own.
