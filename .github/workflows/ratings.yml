name: Ratings mirror

# Mirrors the Worker's /api/ratings into _data/ratings-live.yml once an hour and
# commits it, so the badge is in the built HTML rather than fetched by the page.
# A push from here wakes the Pages build, which is exactly what the mirror is
# for — so the commit must never carry [skip ci], because that would suppress the
# rebuild as well as every other workflow.
#
# The mirror moves data and nothing else: the display rule (a blended average of
# 4.0 or more) lives in _includes/product-rating.html. A non-200, a timeout or an
# unparseable body leaves the file as it was and only warns, so the build keeps
# working on the last good figures. The commit never touches config.json, so it
# does not wake polar-discount.yml.

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# one mirror at a time: two runs racing to push would leave one of them failing
concurrency:
  group: ratings-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - run: python scripts/mirror_ratings.py

      - name: Commit the figures if they moved
        run: |
          if git diff --quiet -- _data/ratings-live.yml; then
            echo "ratings: no change"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/ratings-live.yml
          git commit -m "Mirror live ratings"
          git push
