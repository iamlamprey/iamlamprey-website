name: Polar discount

# Creates/refreshes the Polar percentage discount described by the "discount"
# block in config.json. Push the config change and the discount follows; there is
# no schedule — run it manually with workflow_dispatch when you want to re-apply.
#
# Requires POLAR_ACCESS_TOKEN (scopes: discounts:read, discounts:write) as a secret
# on the "polar" environment — or as a repository secret, which also works. The job
# declares the environment so its rules apply: restrict it to the "main" branch and
# only this workflow can read the token. Set POLAR_ORGANIZATION_ID (repository
# variable, or environment/repository secret) only when the token is not scoped to
# a single organization.

on:
  push:
    branches: [main]
    paths: ['config.json']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    environment: polar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - run: python scripts/apply_discount.py
        env:
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
          POLAR_ORGANIZATION_ID: ${{ vars.POLAR_ORGANIZATION_ID || secrets.POLAR_ORGANIZATION_ID }}
