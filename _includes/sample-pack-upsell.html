<section class="ibl-section" aria-label="Supporter Bundle upsell">
  <div class="ibl-upsell" data-ibl-product="supporter-bundle" data-ibl-buy-label="Get the Supporter Bundle">
    <div class="ibl-upsell-copy">
      <!-- the card's own title, not the product's name — it carries no
           ibl-product-name, which is the hook the renderer writes config.json's
           name into, so it survives the render untouched -->
      <h2 class="ibl-upsell-name">Bundle &amp; Save</h2>
      <p class="ibl-upsell-text">All four packs in one purchase - Ambiences, Glitches, Risers and Sub Drops - 24-bit 96kHz .wav.</p>
    </div>
    <div class="ibl-upsell-buy">
      <div class="ibl-price-row" hidden>
        <span class="ibl-price"></span>
        <span class="ibl-price-old" hidden></span>
        <span class="ibl-sale-chip" hidden></span>
      </div>
      <div class="ibl-sale-timer" hidden></div>
      <p class="ibl-price-note" hidden>Pricing unavailable &mdash; reload the page</p>
      <a class="ibl-buy" href="#" hidden>Get the Supporter Bundle</a>
    </div>
  </div>
</section>
