<footer class="ibl-footer{% if page.nav_theme == 'light' %} ibl-theme-light{% endif %}">
  <div class="ibl-shell">

    <p class="ibl-footer-newsletter-lead">New releases, free packs and sales straight to your inbox.</p>
      {% include newsletter-form.html %} 
    <!-- spacers --> 
    <p> </p>
    <p> </p>

    <div class="ibl-footer-top">      
      <nav class="ibl-footer-nav">
        {% for item in site.data.nav %}
          {% unless item.external %}
        <a href="{{ item.href | relative_url }}">{{ item.label }}</a>
          {% endunless %}
        {% endfor %}
      </nav>
      <nav class="ibl-footer-social" aria-label="iamlamprey on social media">
        <a href="https://www.instagram.com/iamlamprey/" target="_blank" rel="noopener" aria-label="Instagram">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
            <g fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="5.5"/>
              <circle cx="12" cy="12" r="4.75"/>
            </g>
            <circle cx="17" cy="7" r="1.15" fill="currentColor"/>
          </svg>
        </a>
        <a href="https://www.youtube.com/@iamlamprey" target="_blank" rel="noopener" aria-label="YouTube">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
            <rect x="2" y="3" width="20" height="18" rx="5.5" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M10 8.2 16.6 12 10 15.8Z" fill="currentColor"/>
          </svg>
        </a>
      </nav>
    </div>
  </div>

</footer>
