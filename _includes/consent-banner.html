<!-- The consent gate, and the reason the pixel is not in the page's own markup.
     It is rendered hidden and ibl-consent.js unhides it only when no decision is
     on record, so a returning visitor never sees it flash. No focus trap and no
     aria-modal: it sits at the end of the page rather than over it, and blocking
     a visitor behind a notice is worse than the notice itself. There is no
     privacy page to link yet, so the link goes to /contact/ rather than nowhere. -->
<div class="ibl-consent" id="ibl-consent" role="dialog" aria-modal="false" aria-label="Meta pixel consent" hidden>
  <p class="ibl-consent-text">By using this website, you may agree to our use of cookies. We use cookies to provide necessary site functionality and marketing services.</p>
  <div class="ibl-consent-actions">
    <button class="ibl-consent-choice ibl-consent-accept" type="button" data-ibl-consent="granted">Accept</button>
    <button class="ibl-consent-choice ibl-consent-decline" type="button" data-ibl-consent="denied">Decline</button>
  </div>
</div>
