title: iamlamprey
description: Virtual instruments, plugins and sample packs.
url: https://iamlamprey.com
baseurl: ""    # the site is served from the domain root, so nothing gets a prefix
# where /contact/ posts — the Worker that relays to Resend (see README). The
# form is dead until YOUR-SUBDOMAIN is replaced with the subdomain wrangler
# prints on the first deploy.
contact_endpoint: https://iamlamprey-contact.iamlamprey.workers.dev/
# where the site-wide newsletter form posts — the same Worker, on its /subscribe
# route, which emails the address a confirmation link. Nothing is written until that
# link is clicked, on the Worker's /confirm route. There is no separate host to wait
# for: a workers.dev host serving /contact/ serves /subscribe/ too.
newsletter_endpoint: https://iamlamprey-contact.iamlamprey.workers.dev/subscribe
# where /reviews/ posts — the same Worker, on its /reviews route. The rating page
# is the only place a purchase email lands, and the token that email carried is
# what the form submits.
reviews_endpoint: https://iamlamprey-contact.iamlamprey.workers.dev/reviews
# where the product page reads the live figures from — the same Worker, on its
# /api/ratings route. The build renders the hand-pooled baseline; the page fetches
# this and blends the two in the browser, so a figure needs no build step and
# nothing committed. The route answers a wildcard CORS header for that reason.
ratings_endpoint: https://iamlamprey-contact.iamlamprey.workers.dev/api/ratings
# the Meta pixel every page reports to. It is public — it ships in the page
# source — and it stays blank until the pixel has been created in Events Manager
# and the Worker has the two secrets it needs. A blank id renders no pixel, no
# consent banner and no events at all, which is what makes local previews and
# the first deploy harmless: the id is the one switch. It has to stay nil rather
# than "", because Liquid reads an empty string as true and would render the
# pixel anyway.
meta_pixel_id: "2051849245536351"
# where /thanks/ posts a completed checkout — the same Worker, on its /purchase
# route, which looks the order up through Polar and sends the server-side
# Purchase the browser pixel cannot see. The value reaches the page as a meta
# tag, because the script that reads it is not Liquid-processed.
purchase_endpoint: https://iamlamprey-contact.iamlamprey.workers.dev/purchase
exclude:
  - README.md
  - PROMPT.md
  - CONTEXT.md
  - serve.bat
  - Gemfile
  - Gemfile.lock
  - requirements.txt
  - scripts/
  - worker/
  - keys.txt
