title: iamlamprey
description: Virtual instruments, plugins and sample packs.
url: https://iamlamprey.github.io
baseurl: /iamlamprey-website    # project-page URL; set to "" at custom-domain cutover
# where /contact/ posts — the Worker that relays to Resend (see README). The
# form is dead until YOUR-SUBDOMAIN is replaced with the subdomain wrangler
# prints on the first deploy.
contact_endpoint: https://iamlamprey-contact.iamlamprey.workers.dev/
# where the site-wide newsletter form posts — the same Worker, on its /subscribe
# route, which writes the address to the Resend contact list. There is no separate
# host to wait for: a workers.dev host serving /contact/ serves /subscribe/ too.
newsletter_endpoint: https://iamlamprey-contact.iamlamprey.workers.dev/subscribe
# where /reviews/ posts — the same Worker, on its /reviews route. The rating page
# is the only place a purchase email lands, and the token that email carried is
# what the form submits.
reviews_endpoint: https://iamlamprey-contact.iamlamprey.workers.dev/reviews
exclude:
  - README.md
  - PROMPT.md
  - CONTEXT.md
  - serve.bat
  - Gemfile
  - Gemfile.lock
  - requirements.txt
  - scripts/
  - worker/
  - keys.txt
