# Deployed by .github/workflows/contact-worker.yml on any push that touches worker/.
# Nothing secret belongs in this file: it is committed and, once the repo is public,
# readable. RESEND_API_KEY, RESEND_CONTACTS_KEY, TURNSTILE_SECRET,
# POLAR_WEBHOOK_SECRET, SUBSCRIBE_SECRET, META_CAPI_TOKEN and POLAR_ORDERS_TOKEN
# are Worker secrets set in the Cloudflare dashboard (Workers -> the script ->
# Settings -> Variables).
#
# SUBSCRIBE_SECRET signs the double opt-in confirmation links, so it is generated
# once and set once — rotating it invalidates every link that is already out
# there, and the signer has no other use:
#
#   npx wrangler secret put SUBSCRIBE_SECRET --cwd worker
#
# The name is historical — the Worker now answers /contact/, /subscribe, /confirm,
# /polar, /reviews, /api/ratings and /purchase — but it stays as it is: renaming it
# moves the workers.dev host and breaks contact_endpoint in _config.yml for no
# benefit.
name = "iamlamprey-contact"
main = "src/index.js"
compatibility_date = "2026-09-11"

[vars]
ALLOWED_ORIGINS = "https://iamlamprey.com,https://www.iamlamprey.com,https://iamlamprey.github.io,http://127.0.0.1:4000,http://localhost:4000"
TO_EMAIL = "support@iamlamprey.com"
FROM_EMAIL = "iamlamprey contact form <noreply@iamlamprey.com>"
# the rating invites keep their own sender, because the contact relay's display
# name names that form and nothing else
RATING_FROM_EMAIL = "iamlamprey <noreply@iamlamprey.com>"
# the double opt-in confirmation email's sender. Transactional, like the rating
# invites, so it reuses RESEND_API_KEY and carries no unsubscribe — and it keeps
# its own sender for the same reason RATING_FROM_EMAIL does.
SUBSCRIBE_FROM_EMAIL = "iamlamprey <noreply@iamlamprey.com>"
# where the site is published: the Worker fetches config.json from here to resolve
# a Polar product to a rating key, links the invite email back to
# <SITE_URL>/reviews/, and lands a confirmed signup on <SITE_URL>/subscribed/. It
# tracks url: in _config.yml.
SITE_URL = "https://iamlamprey.com"
# the Resend topic every new contact is opted into, and the segment to add them
# to. Ids, not secrets — see the Mailing list section of the README.
RESEND_TOPIC_ID = "c3c747cc-2ef3-4caf-b2f8-22507c655cae"
RESEND_SEGMENT_ID = "a2f5870e-8679-468e-9dd2-c7370b0506e3"

# The Meta pixel both halves of the Purchase report to, and the Conversions API
# test code. The pixel id is public — it ships in the page source, and the same
# number goes in _config.yml as meta_pixel_id — while META_CAPI_TOKEN is a secret.
# META_TEST_EVENT_CODE is normally empty: Meta only routes an event to the Test
# Events tab while it is set, so a value left here would keep production events
# out of the dataset.
META_PIXEL_ID = "2051849245536351"
META_TEST_EVENT_CODE = ""

# Polar's organisation, sent as organization_id on the order lookup. It is only
# needed when POLAR_ORDERS_TOKEN is not scoped to a single organisation — an
# unscoped token's lookup answers 400 without it — so it is normally empty.
POLAR_ORGANIZATION_ID = ""

# The rating invites' database. Created once, outside the repo, from a repo root
# (--cwd worker is relative to it):
#
#   npx wrangler d1 create iamlamprey-ratings
#   npx wrangler d1 migrations apply iamlamprey-ratings --cwd worker --remote
#
# and the id the first command prints goes below. --remote puts the tables in the
# deployed database; without it the apply lands in the local dev one.
[[d1_databases]]
binding = "DB"
database_name = "iamlamprey-ratings"
database_id = "5679ebe9-7c66-4479-9c7a-8a7b71d89615"

# One key: the resolved config.json lookup, so an order resolves its rating key
# without a fetch per order. Also created once:
#
#   npx wrangler kv namespace create CONFIG
[[kv_namespaces]]
binding = "CONFIG"
id = "c38f8d289d614323bd0fde16d4dbf9c9"

# The per-IP ceiling the public routes share. Turnstile stops a script; this
# bounds one that solves Turnstile and then loops — five requests a minute,
# answered 429. namespace_id is arbitrary and only groups the limiters, so there
# is nothing to create in the dashboard.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# The hourly tick that sends the invite. The delay is a day, so an invite lands
# 24-25 hours after the order — the row becomes due at created_at + 86400 and the
# tick is on the hour.
[triggers]
crons = ["0 * * * *"]

# refuse to deploy without the secrets the Worker needs, rather than 502ing every
# signup from a script that is missing one. The two the /purchase route added go in
# the same way, and both have to exist in the dashboard BEFORE the first push that
# carries them: this list is evaluated at deploy time, and a deploy that fails here
# takes the contact form, the newsletter and the reviews down with it.
#
#   npx wrangler secret put META_CAPI_TOKEN --cwd worker
#   npx wrangler secret put POLAR_ORDERS_TOKEN --cwd worker
[secrets]
required = ["RESEND_API_KEY", "RESEND_CONTACTS_KEY", "TURNSTILE_SECRET", "POLAR_WEBHOOK_SECRET", "SUBSCRIBE_SECRET", "META_CAPI_TOKEN", "POLAR_ORDERS_TOKEN"]
